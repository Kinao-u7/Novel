name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build and test
        shell: bash
        run: timeout 14m ./gradlew testDebugUnitTest assembleDebug --continue --console=plain 2>&1 | tee build.log
      - name: Hang diagnostics
        if: always()
        shell: bash
        run: |
          for p in $(jps -q); do
            out=$(jstack "$p" 2>/dev/null | grep -E "com\.example\.[A-Za-z0-9_.]+" | head -40)
            if [ -n "$out" ]; then echo "=== JVM $p"; echo "$out"; fi
          done
      - name: Errors summary
        if: failure()
        shell: bash
        run: |
          echo "=== Compiler errors ==="
          grep -E "^e: " build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -60
          echo "=== Failed tests ==="
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -q "<failure" "$f" && { echo "== $f"; grep -B1 -A2 "<failure" "$f" | cut -c1-300; }
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            build.log
            app/build/reports/tests/
            app/build/outputs/apk/debug/
