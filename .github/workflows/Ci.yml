name: CI
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Helper script
        run: |
          cat > /tmp/grp.sh <<'EOF'
          #!/usr/bin/env bash
          args=()
          for f in "$@"; do args+=(--tests "$f"); done
          timeout 150 ./gradlew testDebugUnitTest "${args[@]}" --console=plain > /tmp/grp.log 2>&1
          rc=$?
          grep -E " FAILED|tests completed|BUILD" /tmp/grp.log | tail -15
          if [ $rc -eq 124 ]; then
            echo "HUNG after 150s: $*"
            ./gradlew --stop > /dev/null 2>&1 || true
            pkill -f "Gradle Test Executor" || true
            exit 1
          fi
          exit 0
          EOF
          chmod +x /tmp/grp.sh
      - name: Compile app and tests
        timeout-minutes: 12
        run: ./gradlew assembleDebug compileDebugUnitTestKotlin --console=plain
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Summarize failed tests
        if: failure()
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("### Failed tests")
          n = 0
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for fl in list(tc.findall("failure")) + list(tc.findall("error")):
                      msg = (fl.get("message") or "").replace("\n", " ").replace("<", "[").replace(">", "]")[:300]
                      cls = (tc.get("classname") or "").split(".")[-1]
                      print(f"- {cls}.{tc.get('name')}: {msg}")
                      for line in (fl.text or "").splitlines():
                          if "com.example" in line:
                              print(f"  {line.strip()}")
                              break
                      n += 1
          print(f"Total failed: {n}")
          EOF
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
      - name: G1 storage basics
        continue-on-error: true
        run: /tmp/grp.sh "*ChapterStorageEngineTest.read*" "*ChapterStorageEngineTest.second*" "*ChapterStorageEngineTest.promote*" "*ChapterStorageEngineTest.hash*"
      - name: G2 eviction and deletes
        continue-on-error: true
        run: /tmp/grp.sh "*ChapterStorageEngineTest.lru*" "*ChapterStorageEngineTest.epubAnd*" "*ChapterStorageEngineTest.deleteDownloads*"
      - name: G3 parallel reads
        continue-on-error: true
        run: /tmp/grp.sh "*ChapterStorageEngineTest.parallel*" "*ChapterStorageEngineTest.failingFetch*"
      - name: G4 epub import
        continue-on-error: true
        run: /tmp/grp.sh "*ChapterStorageEngineTest.importEpub*"
      - name: G5 remove novel
        continue-on-error: true
        run: /tmp/grp.sh "*ChapterStorageEngineTest.removeNovelCompletely*"
      - name: G6 repository tests
        continue-on-error: true
        run: /tmp/grp.sh "*NovelRepositoryTest"
      - name: G7 database and settings
        continue-on-error: true
        run: /tmp/grp.sh "*NovelDatabaseTest" "*SettingsRepositoryTest" "*WtrLabScraperTest"
